  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <rect width="960" height="600" fill="url(#lines)"/>
  <g fill="#ffffff" fill-opacity="0.92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="480" y="278" font-size="28" font-weight="700" letter-spacing="0.08em">MYCHENNAICITY</text>
    <text x="480" y="318" font-size="14" font-weight="600" letter-spacing="0.28em" fill-opacity="0.75">CHENNAI NEWS</text>
