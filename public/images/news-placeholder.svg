<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="MyChennaiCity local news">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A6664"/>
      <stop offset="100%" stop-color="#0E4A48"/>
    </linearGradient>
    <pattern id="lines" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24 L24 0" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
